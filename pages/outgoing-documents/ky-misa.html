<div class="h-full bg-gray-50 flex items-center justify-center font-sans">
    <div class="bg-white w-[360px] shadow-sm border border-gray-100 mt-[-100px]">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-[#008ba3] font-bold text-sm tracking-wide">LOGIN KÝ SỐ</h2>
        </div>
        
        <!-- Body -->
        <div class="px-6 py-5 space-y-4">
            <!-- Username -->
            <div>
                <label class="block text-[13px] text-gray-400 mb-1">Tài khoản Misa</label>
                <div class="relative">
                    <input type="text" value="tnanh@ac.udn.vn" class="w-full border border-gray-300 rounded px-3 py-1.5 text-[15px] bg-[#fff9c4] focus:outline-none focus:border-[#008ba3] pr-8 text-gray-800" />
                    <div class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 bg-gray-200 rounded-full w-5 h-5 flex items-center justify-center">
                        <span class="material-symbols-outlined text-[14px]">verified_user</span>
                    </div>
                </div>
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-[13px] text-gray-400 mb-1">Mật khẩu</label>
                <div class="relative">
                    <input type="password" value="..............." class="w-full border border-gray-300 rounded px-3 py-1.5 text-[15px] bg-[#fff9c4] focus:outline-none focus:border-[#008ba3] pr-8 font-mono tracking-widest text-gray-800" />
                    <div class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 bg-gray-200 rounded-full w-5 h-5 flex items-center justify-center">
                        <span class="material-symbols-outlined text-[14px]">verified_user</span>
                    </div>
                </div>
            </div>
            
            <!-- Error message -->
            <div class="text-[#d9534f] text-[13px] font-medium pt-1">
                Chưa gắn tài khoản ký
            </div>
            
            <!-- Checkbox -->
            <div class="flex items-center gap-2 mt-1">
                <input type="checkbox" id="saveLogin" class="w-3 h-3 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                <label for="saveLogin" class="text-[13px] text-gray-400 cursor-pointer">Lưu 360 ngày</label>
            </div>
            
            <!-- Button -->
            <div class="pt-4 pb-2">
                <button onclick="alert('Đăng nhập Ký số Misa')" class="w-full bg-[#1565c0] hover:bg-blue-800 text-white font-medium py-2 rounded text-sm transition-colors shadow-sm">
                    Login
                </button>
            </div>
        </div>
    </div>
</div>
